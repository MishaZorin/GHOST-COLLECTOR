
name: Threadline CD

on:
  workflow_run:
    workflows:
      - "Threadline CI"
    types:
      - completed

jobs:
  deploy:
    # Запускаем деплой только если CI успешно завершился
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    # GitHub запускает эту задачу на своей машине
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        # Подключаемся к VPS по SSH
        uses: appleboy/ssh-action@v1.2.2

        with:
          # IP-адрес VPS
          host: ${{ secrets.VPS_HOST }}

          # Пользователь VPS
          username: ${{ secrets.VPS_USER }}

          # Приватный SSH-ключ
          key: ${{ secrets.VPS_SSH_KEY }}

          # На твоём VPS SSH работает на 6767, а не на 22
          port: 6767

          script: |
        
            cd /var/www/second-app

         
            git pull origin master

            docker compose -f docker-compose.prod.yml pull

          
            docker compose -f docker-compose.prod.yml up -d
