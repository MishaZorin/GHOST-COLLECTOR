version: '3.8'

services:
  # 1. СЕРВИС БАЗЫ ДАННЫХ
  postgres:
    image: postgres:15-alpine
    container_name: ghost_collector_db
    restart: always
    environment:
      POSTGRES_USER: ghost_operator
      POSTGRES_PASSWORD: top_secret_password_2026
      POSTGRES_DB: ghost_clues_db
    ports:
      - "5439:5432" # Снаружи к базе можно подключиться через 188.242.124.186:5439
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. СЕРВИС БЭКЕНДА
  backend:
    image: ghcr.io/mishazorin/threadline-backend:latest
    container_name: ghost_collector_backend
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env # Автоматически подтянет DATABASE_URL и JWT_SECRET из файла .env
    depends_on:
      - postgres

  # 3. СЕРВИС ФРОНТЕНДА
  frontend:
    image: ghcr.io/mishazorin/threadline-frontend:latest
    container_name: ghost_collector_frontend
    restart: always
    ports:
      - "8081:80" # Изменено на 8081, так как 80 порт занят системным Nginx
    depends_on:
      - backend

volumes:
  pgdata:
